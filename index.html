<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Natal em Gramado e Canela 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de uma coluna. Capa noturna com luzes de Natal animadas, barra fixa com abas e dias, um dia por vez como linha do tempo com trilho e pontos. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E7EAF0; --ink:#0E1726; --muted:#5B6576; --line:#DCE1E9;
  --accent:#0F7A57; --accent-ink:#FFFFFF; --accent-soft:#DDF1E8;
  --gold:#8F5B00; --gold-soft:#F8ECD2; --red:#B3261E; --red-soft:#FCE5E2; --blue:#2458A6; --blue-soft:#E2EBFA;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 6px 20px rgba(14,23,38,.07);
  --night-a:#0A1426; --night-b:#13284A; --night-c:#0E3E3A; --night-ink:#F4F1E8; --night-muted:#B9C3D4; --bulb:#FFC85C;
  --f-body:"Onest", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080D16; --surface:#121A27; --surface-2:#1B2535; --ink:#E9EEF6; --muted:#97A3B6; --line:#253145;
  --accent:#57D3A2; --accent-ink:#04150E; --accent-soft:#12302A;
  --gold:#F0C463; --gold-soft:#33291A; --red:#F28B82; --red-soft:#3A1D1C; --blue:#8DB6F2; --blue-soft:#17263F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080D16; --surface:#121A27; --surface-2:#1B2535; --ink:#E9EEF6; --muted:#97A3B6; --line:#253145;
  --accent:#57D3A2; --accent-ink:#04150E; --accent-soft:#12302A;
  --gold:#F0C463; --gold-soft:#33291A; --red:#F28B82; --red-soft:#3A1D1C; --blue:#8DB6F2; --blue-soft:#17263F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .14s var(--ease),background-color .2s,color .2s}
button:active{transform:scale(.96)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:760px;margin:0 auto;padding-block:14px calc(90px + env(safe-area-inset-bottom,0px))}

/* Capa */
.hero{position:relative;overflow:hidden;border-radius:26px;color:var(--night-ink);
  background:radial-gradient(120% 90% at 85% 0%,var(--night-b) 0%,transparent 60%),linear-gradient(165deg,var(--night-a) 0%,var(--night-b) 55%,var(--night-c) 100%);
  padding:58px 18px 18px;display:flex;flex-direction:column;gap:12px;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--night-muted)}
.count{display:inline-flex;align-items:center;gap:8px;width:fit-content;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  background:rgba(255,200,92,.14);color:var(--bulb);border:1px solid rgba(255,200,92,.3);border-radius:999px;padding:5px 11px}
.count::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bulb);box-shadow:0 0 10px var(--bulb);animation:blink 1.8s ease-in-out infinite}
h1{margin:0;font-size:clamp(30px,8vw,46px);line-height:1;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
h1 span{background:linear-gradient(90deg,var(--bulb),#FFE7B0 50%,var(--bulb));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 6s linear infinite}
.titlerow{display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.editbtn{flex:0 0 auto;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--night-ink)}
.editbtn svg{width:15px;height:15px}
.editbtn.on{background:var(--bulb);border-color:transparent;color:var(--night-a)}
.codein{font:inherit;font-family:var(--f-mono);font-size:26px;letter-spacing:.5em;text-align:center;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;padding:14px}
.crew{display:flex;flex-wrap:wrap;gap:6px}
.crew span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 11px 3px 3px;font-size:13.5px;font-weight:600;color:var(--night-ink)}
.crew i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--bulb);color:var(--night-a)}
.crew span:nth-child(2) i{background:#FF8C7A}.crew span:nth-child(3) i{background:#7FE0B5}.crew span:nth-child(4) i{background:#9CC3FF}.crew span:nth-child(5) i{background:#F4F1E8}
.crew small{color:var(--night-muted);font-weight:500}

/* Barra fixa */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:14px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;
  padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.stuck{border-bottom-color:var(--line)}
.days{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.days .ind{position:absolute;top:0;left:0;height:100%;border-radius:14px;background:var(--ink);box-shadow:0 6px 18px rgba(14,23,38,.22);transition:transform .45s cubic-bezier(.34,1.4,.5,1),width .45s;z-index:0}
.days button{position:relative;z-index:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px}
.days button[aria-pressed="true"]{background:transparent;border-color:transparent;color:var(--bg)}
.days b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.days small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.days button[aria-pressed="true"] small{color:inherit;opacity:.7}
.days .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
.days .today{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}

.tabbar div{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);border-radius:13px;padding:3px}
.tabbar .tind{position:absolute;top:3px;bottom:3px;left:3px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);transition:transform .4s cubic-bezier(.34,1.3,.5,1),width .4s}
.tabbar button{position:relative;z-index:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;min-width:0}
.tabbar svg{width:17px;height:17px;flex:0 0 auto}
@media (max-width:380px){.tabbar svg{display:none}}
.tabbar button[aria-pressed="true"]{color:var(--ink)}
.badge{font-family:var(--f-mono);font-size:10.5px;background:var(--red);color:var(--surface);border-radius:999px;padding:0 6px;margin-left:3px}

/* Cabeçalho do dia */
.dayhead{margin:22px 0 14px;display:flex;flex-direction:column;gap:3px}
.dayhead .wk{font-family:var(--f-mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.dayhead h2{margin:0;font-size:clamp(22px,5.6vw,28px);font-weight:800;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
.dayhead p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stats span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.stats b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats svg{width:14px;height:14px;color:var(--muted)}

/* Linha do tempo */
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{position:relative;display:flex;flex-direction:column;gap:6px;padding-bottom:14px}
.item::before{content:"";position:absolute;left:68px;top:0;bottom:0;width:2px;background:linear-gradient(var(--line),var(--line));border-radius:2px}
.item:first-child::before{top:18px}
.item:last-child::before{bottom:auto;height:18px}
.item:only-child::before{display:none}
.gap,.travel{position:relative;display:flex;align-items:center;gap:8px;margin-left:86px;font-size:13px;color:var(--muted)}
.travel svg,.gap svg{flex:0 0 auto;width:15px;height:15px;margin-top:1px}
.travel b,.gap b{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.travel{background:var(--surface-2);border-radius:14px;align-items:flex-start;line-height:1.35;padding:5px 11px;width:fit-content;max-width:calc(100% - 86px)}
.gap{border:1px dashed var(--line);border-radius:14px;padding:5px 11px;width:fit-content;max-width:calc(100% - 86px)}
.row{display:grid;grid-template-columns:54px 16px minmax(0,1fr);gap:8px;align-items:start}
.time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right}
.time b{display:block;font-size:15px;font-weight:600}
.time span{display:block;font-size:12px;color:var(--muted)}
.node{position:relative;height:100%}
.node::before{content:"";position:absolute;left:3px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent);z-index:1}
.item[data-type="show"] .node::before{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft),0 0 14px var(--gold)}
.item[data-type="food"] .node::before{border-color:var(--blue)}
.item[data-type="free"] .node::before{border-color:var(--accent);background:var(--accent)}
.item.locked .node::before{border-color:var(--muted);width:8px;height:8px;left:4px;top:15px}
.item.now .node::before{background:var(--red);border-color:var(--red);animation:pulse 1.6s ease-out infinite}

.swipe{position:relative;min-width:0;border-radius:18px;overflow:hidden;background:var(--surface-2)}
.actions{position:absolute;inset:0 0 0 auto;display:flex;visibility:hidden}
.swipe.reveal .actions{visibility:visible}
.swipe:not(.reveal){background:transparent}
.actions button{border:0;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:700}
.actions svg{width:20px;height:20px}
.actions .mv{background:var(--blue);color:var(--surface)}
.actions .del{background:var(--red);color:var(--surface)}
.card{position:relative;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px 14px;touch-action:pan-y;transition:transform .32s cubic-bezier(.3,1.25,.5,1),box-shadow .2s;display:flex;flex-direction:column;gap:6px}
.card.dragging{transition:none;-webkit-user-select:none;user-select:none}
.item[data-type="show"] .card{border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--gold),transparent 55%,var(--gold)) border-box}
.item.now .card{box-shadow:0 0 0 2px var(--red),var(--shadow)}
.nowtag{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--red);color:var(--surface);padding:3px 7px;border-radius:6px}
.top{display:flex;align-items:center;gap:6px;min-height:22px}
.top .sp{flex:1}
.chip{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.show{background:var(--gold-soft);color:var(--gold)}
.chip.food{background:var(--blue-soft);color:var(--blue)}
.chip.free{background:var(--accent-soft);color:var(--accent)}
.chip.fix{background:var(--surface-2);color:var(--muted)}
.icbtn{border:0;background:transparent;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icbtn:hover{background:var(--surface-2)}
.icbtn svg{width:18px;height:18px}
.grip{cursor:grab;touch-action:none}
.card h3{margin:0;font-size:17px;font-weight:700;line-height:1.28;letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.card .sched{font-family:var(--f-mono);font-size:12.5px;color:var(--ink)}
.alert{display:flex;gap:7px;align-items:flex-start;background:var(--red-soft);color:var(--red)!important;border-radius:10px;padding:7px 9px;font-size:13.5px!important;font-weight:600;animation:shake .5s var(--ease)}
.alert svg{flex:0 0 auto;width:16px;height:16px;margin-top:1px}
.resv{background:var(--gold-soft);color:var(--gold)!important;border-radius:10px;padding:7px 9px;font-size:13.5px!important;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.links a{font-size:13px;font-weight:600;text-decoration:none;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 12px;transition:transform .14s var(--ease)}
.links a:active{transform:scale(.95)}
.item.locked .card{background:transparent;box-shadow:none;border:1px dashed var(--line);padding:10px 14px}
.item.locked .card h3{font-size:15px;color:var(--muted);font-weight:600}
.item.locked .swipe{background:transparent}
.sortable-ghost .card{opacity:.35}
.sortable-chosen .card{box-shadow:0 18px 40px rgba(14,23,38,.22);transform:scale(1.02)}
.hint{margin:4px 0 0 86px;font-size:12.5px;color:var(--muted)}

/* Excluídos e Dicas */
.panel h2{margin:22px 0 4px;font-size:clamp(22px,5.6vw,28px);font-weight:800;letter-spacing:-.025em}
.panel>p.lead{margin:0 0 14px;color:var(--muted)}
.box{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:15px 16px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}
.box p,.box li{color:var(--muted);font-size:14.5px}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px}
.box p{margin:0}
.rem{display:flex;align-items:center;gap:12px}
.rem div{flex:1;min-width:0}
.rem small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--red);color:var(--surface)}
.empty{text-align:center;color:var(--muted);padding:48px 10px}
.src a{word-break:break-word}

/* Folha inferior */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,9,16,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;animation:up .38s cubic-bezier(.2,.9,.25,1) both;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:20px;letter-spacing:-.015em}
.sheet .lbl{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.seg button small{font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:inherit}
select,input[type="time"]{font:inherit;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:11px 12px}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.radio input[type="time"]{width:auto;padding:6px 8px;margin-left:auto}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 12px 11px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.28);max-width:calc(100% - 32px);transform:translateX(-50%);animation:toast .42s cubic-bezier(.3,1.4,.5,1) both}
.toast span{white-space:nowrap}
.toast button{border:0;background:transparent;color:var(--bulb);font-weight:800}

/* Movimento */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sheen{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,20px) scale(.95)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.anim .item{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.anim-l .dayhead,.anim-l .panel{animation:inL .42s var(--ease) both}
.anim-r .dayhead,.anim-r .panel{animation:inR .42s var(--ease) both}
.anim .box{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}

@media (max-width:420px){
  .row{grid-template-columns:46px 14px minmax(0,1fr);gap:7px}
  .item::before{left:58px}
  .node::before{left:2px}
  .gap,.travel,.hint{margin-left:74px}.gap,.travel{max-width:calc(100% - 74px)}
  .time b{font-size:14px}.time span{font-size:11.5px}
  .card{padding:11px 12px 13px}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <canvas id="lights" aria-hidden="true"></canvas>
    <span class="count" id="count">17 a 22 de dezembro</span>
    <div class="titlerow"><h1>Natal em <span>Gramado</span> e Canela</h1><button class="editbtn" id="editbtn" hidden></button></div>
    <div class="eyebrow">17 a 22/12/2026 · Airbnb + carro próprio</div>

const KEY='roteiro-gramado-v2';
const defaults=()=>{const o={};DL.forEach(d=>o[d]=[]);for(const id in ITEMS)o[ITEMS[id].day].push(id);return {order:o,removed:[],fixed:{}}};
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}return normalize(s)}
function normalize(s){
  if(!s||!s.order)return defaults();s=JSON.parse(JSON.stringify(s));
  const seen=new Set();DL.forEach(d=>{s.order[d]=(s.order[d]||[]).filter(id=>ITEMS[id]&&!seen.has(id)&&seen.add(id))});
  s.removed=(s.removed||[]).filter(r=>ITEMS[r.id]&&!seen.has(r.id)&&seen.add(r.id));
  for(const id in ITEMS)if(!seen.has(id))s.order[ITEMS[id].day].push(id);
  s.fixed=s.fixed||{};return s}
let S=load();
/* Modo compartilhado: no Netlify o roteiro fica salvo online e só quem tem o código edita. */
const API='/api/roteiro';let REMOTE=false,rev=0,code='';
try{code=localStorage.getItem(KEY+'-code')||''}catch(e){}
const canEdit=()=>!REMOTE||!!code;
function save(){
  if(!REMOTE){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}
  const body=JSON.stringify({baseRev:rev,state:S});
  fetch(API,{method:'PUT',headers:{'content-type':'application/json','x-edit-code':code},body}).then(async r=>{
    const j=await r.json().catch(()=>null);
    if(r.ok&&j){rev=j.rev;return}
    if(r.status===409&&j){S=normalize(j.state);rev=j.rev;render();toast('Outra pessoa alterou o roteiro antes. Mostrando a versão mais recente; refaça a sua mudança.');return}
    if(r.status===401){code='';try{localStorage.removeItem(KEY+'-code')}catch(e){}await pull(true);toast('Código de edição inválido. A mudança não foi salva.');return}
    await pull(true);toast('Não foi possível salvar. Verifique a conexão e tente de novo.')
  }).catch(()=>{toast('Sem conexão: a mudança não foi salva.');setTimeout(()=>pull(true),1500)})}
async function pull(force){
  try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)return false;const j=await r.json();
    REMOTE=true;if(force||j.rev!==rev){rev=j.rev||0;S=normalize(j.state);if(!document.querySelector('.sheet')&&!sw)render()}return true}catch(e){return false}}
const snap=()=>JSON.parse(JSON.stringify(S));

const toM=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const hm=m=>{m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return String(h%24).padStart(2,'0')+':'+String(mm).padStart(2,'0')};
const dur=m=>m>=60?(Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')):m+' min';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fixedOf=id=>Object.prototype.hasOwnProperty.call(S.fixed,id)?S.fixed[id]:(ITEMS[id].fixed||null);
const dayObj=d=>DAYS.find(x=>x.d===d);

function compute(d){
  let cur=toM(dayObj(d).start),out=[],prev=null;
  for(const id of S.order[d]){
    const it=ITEMS[id],fx=fixedOf(id),tr=it.travel?it.travel[0]:0,alerts=[];
    let arrive=cur+tr,gap=0,target=null;
    if(fx)target=toM(fx)-(it.early||0);else if(it.opens)target=toM(it.opens);
    if(target!=null&&arrive<target){gap=target-arrive;if(prev&&prev.flex){prev.end+=gap;gap=0}arrive=target}
    let start=fx?Math.max(toM(fx),arrive):arrive;
    if(fx&&arrive>toM(fx)-(it.early||0)){
      if(arrive>toM(fx))alerts.push(`Começa às ${fx}, mas vocês só chegam às ${hm(arrive)}.`);
      else alerts.push(`O ideal é chegar até ${hm(toM(fx)-it.early)}; pela sequência, vocês chegam às ${hm(arrive)}.`)}
    const end=start+it.dur;
    if(it.days&&!it.days.includes(d))alerts.push(`Não acontece em ${d}/12. Datas nesta semana: ${it.days.map(x=>x+'/12').join(', ')}.`);
    if(it.closes&&end>toM(it.closes))alerts.push(`Fecha às ${it.closes}; pela sequência, a visita termina às ${hm(end)}.`);
    if(end>24*60)alerts.push('Termina depois da meia-noite.');
    const r={id,it,fx,tr,travelStart:arrive-tr,start,end,gap,alerts,flex:!!it.flex};
    out.push(r);prev=r;cur=end}
  return out}

function nowBR(){try{const f=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());

    const travel=r.tr?`<div class="travel">${IC.car}<b>${hm(r.travelStart)}</b> · <span>${dur(r.tr)} · ${esc(it.travel[1])}</span></div>`:'';
    const tags=(it.tag?`<span class="chip ${it.tag[0]}">${esc(it.tag[1])}</span>`:'')+(r.fx&&!lock?`<span class="chip fix">${IC.pin} ${r.fx}</span>`:'');
    const sched=it.early?`<p class="sched">Chegar até ${hm(toM(r.fx||it.fixed)-it.early)}</p>`:'';
    const alerts=r.alerts.map(a=>`<p class="alert">${IC.warn}<span>${esc(a)}</span></p>`).join('');
    const links=it.links?`<div class="links">${it.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}</div>`:'';
    const ctrl=lock?'':`<button class="icbtn more" data-more="${r.id}" aria-label="Opções de ${esc(it.title)}">${IC.more}</button><span class="icbtn grip" aria-label="Arrastar para reordenar" title="Arrastar para reordenar">${IC.grip}</span>`;
    const time=it.dur?`<b>${hm(r.start)}</b><span>${hm(r.end)}</span>`:`<b>${hm(r.start)}</b>`;
    const now=NOW&&NOW.d===d&&NOW.m>=r.travelStart&&NOW.m<Math.max(r.end,r.start+1);
    const type=it.tag?it.tag[0]:'';
    return `<li class="item${lock?' locked':''}${now?' now':''}${it.home||r.id==='saida'?' locked-end':''}" data-id="${r.id}" data-type="${type}" style="--i:${i}">${gap}${travel}
      <div class="row"><div class="time">${time}</div><div class="node" aria-hidden="true"></div>
      <div class="swipe">${lock?'':`<div class="actions"><button class="mv" data-move="${r.id}">${IC.move}Mover</button><button class="del" data-del="${r.id}">${IC.trash}Excluir</button></div>`}

  const ev=rows.filter(r=>!r.it.lock).length,road=rows.reduce((a,r)=>a+r.tr,0),last=rows.length?rows[rows.length-1].end:0;
  const stats=rows.length?`<div class="stats"><span>${IC.cal}<b>${ev}</b> ${ev===1?'evento':'eventos'}</span><span>${IC.car}<b>${dur(road)}</b> de deslocamento</span><span>${IC.clock}até <b>${hm(last)}</b></span></div>`:'';

/* Folha para mover ou reativar */
function openSheet(id,mode){
  const removed=S.removed.find(r=>r.id===id);
  let fromDay=removed?removed.day:DL.find(d=>S.order[d].includes(id));
  let day=fromDay;
  const fx=fixedOf(id),it=ITEMS[id];
  let pos=null;
  if(removed){pos=Math.max(0,removed.index)}else{pos=S.order[fromDay].indexOf(id)}
  const layer=document.getElementById('layer');
  const draw=()=>{
    const others=S.order[day].filter(x=>x!==id);
    const rows=compute(day).filter(r=>r.id!==id);
    const defPos=day===fromDay?Math.min(pos,others.length):others.length-(others.length&&ITEMS[others[others.length-1]].home?1:0);
    const opts=['<option value="0">No início do dia</option>'].concat(rows.map((r,i)=>`<option value="${i+1}">Depois de ${hm(r.start)} · ${esc(r.it.title)}</option>`)).join('');
    layer.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="in">
      <h2 id="sh-t">${mode==='restore'?'Reativar':'Mover'}: ${esc(it.title)}</h2>
      <div><div class="lbl">Dia</div><div class="seg">${DAYS.map(x=>`<button data-sday="${x.d}" aria-pressed="${x.d===day}"><b>${x.d}</b><small>${x.wd}</small></button>`).join('')}</div></div>
      <div><label class="lbl" for="sh-pos">Posição</label><select id="sh-pos">${opts}</select></div>
      <div><div class="lbl">Horário</div><div class="radio">
        <label><input type="radio" name="sh-mode" id="sh-seq" value="seq" ${fx?'':'checked'}> Seguir a sequência do dia</label>
        <label><input type="radio" name="sh-mode" id="sh-fix" value="fix" ${fx?'checked':''}> Começar às <input type="time" id="sh-time" value="${fx||'10:00'}" step="300"></label>
      </div>${it.fixed?`<p style="margin:6px 0 0;color:var(--muted);font-size:13px">Horário oficial: ${it.fixed}${it.days?' · datas: '+it.days.map(x=>x+'/12').join(', '):''}</p>`:''}</div>
      <div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="sh-ok">${mode==='restore'?'Reativar':'Mover'}</button></div></div></div>`;
    layer.querySelector('#sh-pos').value=String(defPos);
    layer.querySelector('#sh-time').addEventListener('input',()=>{layer.querySelector('#sh-fix').checked=true});
  };
  draw();
  layer.onclick=e=>{
    const t=e.target.closest('[data-sday],[data-close],#sh-ok');if(!t)return;
    if(t.dataset.sday){pos=Number(layer.querySelector('#sh-pos').value);day=t.dataset.sday;draw();return}
    if(t.hasAttribute('data-close')){layer.innerHTML='';return}
    const before=snap();
    const p=Number(layer.querySelector('#sh-pos').value);
    DL.forEach(d=>S.order[d]=S.order[d].filter(x=>x!==id));S.removed=S.removed.filter(r=>r.id!==id);
    S.order[day].splice(p,0,id);
    if(layer.querySelector('#sh-fix').checked){const v=layer.querySelector('#sh-time').value;if(v)S.fixed[id]=v}else S.fixed[id]=null;
    save();layer.innerHTML='';cur=day;tab='roteiro';remember();render();window.scrollTo(0,0);
    toast(mode==='restore'?`Reativado em ${day}/12`:`Movido para ${day}/12`,before)};
  setTimeout(()=>layer.querySelector('#sh-ok')&&layer.querySelector('#sh-ok').focus(),30);
}

function openCode(){
  const layer=document.getElementById('layer');
  layer.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cd-t"><div class="in">
   <h2 id="cd-t">Código de edição</h2><p style="margin:0;color:var(--muted)">Informe o código para mover, excluir e reativar eventos. Ele fica guardado neste aparelho.</p>

   <p id="cd-err" style="margin:0;color:var(--red);font-weight:600" hidden>Código incorreto.</p>
   <div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="cd-ok">Entrar</button></div></div></div>`;
  const inp=layer.querySelector('#cd-in');setTimeout(()=>inp.focus(),30);
  const go=async()=>{const v=inp.value.trim();if(!v)return;

/* Deslizar para revelar ações */
const OPEN=-152;let open=null,sw=null;
function closeOpen(){if(open){const c=open;c.style.transform='';open=null;setTimeout(()=>{if(open!==c)c.parentElement.classList.remove('reveal')},330)}}
document.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card[data-card]');
  if(open&&!e.target.closest('.swipe')){closeOpen()}
  if(!card||!card.dataset.card||e.target.closest('.grip,button,a'))return;
  if(open&&open!==card)closeOpen();
  sw={card,x:e.clientX,y:e.clientY,base:card===open?OPEN:0,dx:0,active:false,id:e.pointerId}});
document.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.active){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){sw.active=true;sw.card.classList.add('dragging');sw.card.parentElement.classList.add('reveal');try{sw.card.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(dy)>10){sw=null;return}else return}
  sw.dx=dx;const x=Math.min(0,Math.max(OPEN-40,sw.base+dx));sw.card.style.transform=`translateX(${x}px)`});
function endSwipe(e){if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;if(!s.active)return;s.card.classList.remove('dragging');
  const x=s.base+s.dx;if(x<OPEN/2){s.card.style.transform=`translateX(${OPEN}px)`;open=s.card}else{s.card.style.transform='';if(open===s.card)open=null;const c=s.card;setTimeout(()=>{if(open!==c)c.parentElement.classList.remove('reveal')},330)}}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',endSwipe);

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-day],[data-more],[data-move],[data-del],[data-restore],#reset,#logout,#editbtn,#tab-roteiro,#tab-excluidos,#tab-infos');if(!t)return;
  if(t.id==='editbtn'){if(!code)openCode();else{tab='infos';render();window.scrollTo(0,0)}return}
  if(t.id==='logout'){code='';try{localStorage.removeItem(KEY+'-code')}catch(e){}render();toast('Modo de edição desativado neste aparelho');return}
  if(!canEdit()&&(t.dataset.more||t.dataset.move||t.dataset.del||t.dataset.restore||t.id==='reset'))return;
  if(t.dataset.day){cur=t.dataset.day;remember();closeOpen();render();window.scrollTo(0,0);return}

  if(t.dataset.move){closeOpen();openSheet(t.dataset.move,'move');return}

  if(t.id==='reset'){if(t.dataset.confirm){const before=snap();S=defaults();save();tab='roteiro';cur=DL[0];remember();render();window.scrollTo(0,0);toast('Roteiro original restaurado',before)}

});

/* Luzes de Natal na capa */
(function(){const cv=document.getElementById('lights'),cx=cv.getContext('2d');if(!cx)return;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS=['#FFC85C','#FF7A6B','#7FE0B5','#9CC3FF','#FFE7B0'];let W=0,H=0,bulbs=[],snow=[];
  function setup(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    bulbs=[];const wires=[{y:14,sag:22},{y:6,sag:34}];
    wires.forEach((w,wi)=>{const n=Math.max(8,Math.round(W/34));for(let i=0;i<=n;i++){const t=i/n,x=t*W,y=w.y+w.sag*4*t*(1-t);
      bulbs.push({x,y:y+5,c:COLORS[(i+wi*2)%COLORS.length],ph:Math.random()*6.28,sp:.8+Math.random()*1.4,w:wi})}});
    snow=Array.from({length:Math.round(W/9)},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.6,v:.15+Math.random()*.45,dx:(Math.random()-.5)*.2}))}
  function wire(w){cx.beginPath();const y0=w===0?14:6,sag=w===0?22:34;for(let i=0;i<=40;i++){const t=i/40,x=t*W,y=y0+sag*4*t*(1-t);i?cx.lineTo(x,y):cx.moveTo(x,y)}
    cx.strokeStyle='rgba(255,255,255,.18)';cx.lineWidth=1;cx.stroke()}
  function frame(ts){cx.clearRect(0,0,W,H);const t=(ts||0)/1000;
    for(const f of snow){if(!still){f.y+=f.v;f.x+=f.dx;if(f.y>H){f.y=-3;f.x=Math.random()*W}}cx.globalAlpha=.55;cx.fillStyle='#FFFFFF';cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.28);cx.fill()}
    cx.globalAlpha=1;wire(1);wire(0);
    for(const b of bulbs){const a=still?.9:.45+.55*(.5+.5*Math.sin(t*b.sp*2+b.ph));
      const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,14);g.addColorStop(0,b.c);g.addColorStop(1,'transparent');
      cx.globalAlpha=a*.55;cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,14,0,6.28);cx.fill();
      cx.globalAlpha=.35+a*.65;cx.fillStyle=b.c;cx.beginPath();cx.ellipse(b.x,b.y,2.6,3.6,0,0,6.28);cx.fill()}
    cx.globalAlpha=1;if(!still)requestAnimationFrame(frame)}
