<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Natal em Gramado e Canela 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de uma coluna. Cabeçalho curto, faixa de dias fixa no topo, um dia por vez como linha do tempo de cartões, barra de abas fixa embaixo. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E8ECEA; --ink:#101A16; --muted:#5D6B65; --line:#DCE2DF;
  --accent:#0E6B4E; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6;
  --gold:#8A5A00; --gold-soft:#F6EBD3; --red:#B3261E; --red-soft:#FBE4E1; --blue:#245C8F; --blue-soft:#E1ECF7;
  --shadow:0 1px 2px rgba(16,26,22,.06),0 4px 14px rgba(16,26,22,.06);
  --f-body:"Onest", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1210; --surface:#151E1A; --surface-2:#1E2924; --ink:#E7EEEA; --muted:#9AABA3; --line:#2A3631;
  --accent:#5CCB9C; --accent-ink:#06140E; --accent-soft:#163327;
  --gold:#E7BE63; --gold-soft:#332917; --red:#F28B82; --red-soft:#3A1D1A; --blue:#8DBBE8; --blue-soft:#182838;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#151E1A; --surface-2:#1E2924; --ink:#E7EEEA; --muted:#9AABA3; --line:#2A3631;
  --accent:#5CCB9C; --accent-ink:#06140E; --accent-soft:#163327;
  --gold:#E7BE63; --gold-soft:#332917; --red:#F28B82; --red-soft:#3A1D1A; --blue:#8DBBE8; --blue-soft:#182838;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:760px;margin:0 auto;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}

/* Cabeçalho */
.hero{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(26px,6.4vw,38px);line-height:1.05;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.titlerow{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.editbtn{flex:0 0 auto;margin-top:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.editbtn svg{width:15px;height:15px}
.editbtn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.codein{font:inherit;font-family:var(--f-mono);font-size:24px;letter-spacing:.4em;text-align:center;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px}
.crew{display:flex;flex-wrap:wrap;gap:6px}
.crew span{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13.5px;font-weight:600}
.crew i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.crew small{color:var(--muted);font-weight:500}

/* Faixa de dias */
.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:16px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;
  padding:10px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;border-bottom:1px solid var(--line)}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.days b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.days small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.75}
.days .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}

/* Cabeçalho do dia */
.dayhead{margin:20px 0 12px;display:flex;flex-direction:column;gap:2px}
.dayhead .wk{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dayhead h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.dayhead p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

/* Linha do tempo */
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.gap,.travel{display:flex;align-items:center;gap:8px;margin-left:72px;font-size:13px;color:var(--muted)}
.travel svg,.gap svg{flex:0 0 auto;width:15px;height:15px}
.travel b,.gap b{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.gap{border:1px dashed var(--line);border-radius:10px;padding:6px 10px;width:fit-content;max-width:calc(100% - 72px)}
.row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start}
.time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right}
.time b{display:block;font-size:15px;font-weight:600}
.time span{display:block;font-size:12px;color:var(--muted)}

.swipe{position:relative;min-width:0;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.actions{position:absolute;inset:0 0 0 auto;display:flex}
.actions button{border:0;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600}
.actions svg{width:20px;height:20px}
.actions .mv{background:var(--blue);color:var(--surface)}
.actions .del{background:var(--red);color:var(--surface)}
.card{position:relative;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 13px;touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:5px}
.card.dragging{transition:none}
.top{display:flex;align-items:center;gap:6px;min-height:22px}
.top .sp{flex:1}
.chip{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.chip.show{background:var(--gold-soft);color:var(--gold)}
.chip.food{background:var(--blue-soft);color:var(--blue)}
.chip.free{background:var(--accent-soft);color:var(--accent)}
.chip.fix{background:var(--surface-2);color:var(--muted)}
.icbtn{border:0;background:transparent;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icbtn:hover{background:var(--surface-2)}
.icbtn svg{width:18px;height:18px}
.grip{cursor:grab;touch-action:none}
.card h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.3;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.card .sched{font-family:var(--f-mono);font-size:12.5px;color:var(--ink)}
.alert{display:flex;gap:7px;align-items:flex-start;background:var(--red-soft);color:var(--red)!important;border-radius:9px;padding:7px 9px;font-size:13.5px!important;font-weight:600}
.alert svg{flex:0 0 auto;width:16px;height:16px;margin-top:1px}
.resv{background:var(--gold-soft);color:var(--gold)!important;border-radius:9px;padding:7px 9px;font-size:13.5px!important;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.links a{font-size:13px;font-weight:600;text-decoration:none;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 11px}
.item.locked .card{background:transparent;box-shadow:none;border:1px solid var(--line)}
.item.locked .swipe{background:transparent}
.sortable-ghost .card{opacity:.35}
.sortable-chosen .card{box-shadow:0 10px 30px rgba(16,26,22,.18)}
.hint{margin:4px 0 0 72px;font-size:12.5px;color:var(--muted)}

/* Excluídos e Infos */
.panel h2{margin:20px 0 4px;font-size:21px;font-weight:700}
.panel>p.lead{margin:0 0 14px;color:var(--muted)}
.box{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}
.box p,.box li{color:var(--muted);font-size:14.5px}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px}
.box p{margin:0}
.rem{display:flex;align-items:center;gap:12px}
.rem div{flex:1;min-width:0}
.rem small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:11px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--red);color:var(--surface)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.src a{word-break:break-word}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabbar button{border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.badge{font-family:var(--f-mono);font-size:10.5px;background:var(--red);color:var(--surface);border-radius:999px;padding:0 6px;margin-left:3px}

/* Folha inferior */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,11,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:19px}
.sheet .lbl{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.seg button small{font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:inherit}
select,input[type="time"]{font:inherit;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.radio input[type="time"]{width:auto;padding:6px 8px;margin-left:auto}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;filter:brightness(1.4)}

@media (max-width:420px){.row{grid-template-columns:52px minmax(0,1fr);gap:8px}.gap,.travel,.hint{margin-left:60px}.gap{max-width:calc(100% - 60px)}.time b{font-size:14px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header class="hero">

</div></nav>

<script>
(function(){
if('scrollRestoration' in history) history.scrollRestoration='manual';
if(location.hash) history.replaceState(null,'',location.pathname+location.search);
window.scrollTo(0,0);

const NL=[['Site oficial','https://natalluz.ingressos.com.br/programacao'],['Instagram','https://www.instagram.com/natalluzoficial/']];
const SN=[['Site oficial','https://sonhodenatal.com.br/'],['Instagram','https://www.instagram.com/sonhodenataloficial/']];
const map=q=>['Mapa','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)];

const DAYS=[
 {d:'17',wd:'qui',full:'Quinta-feira',start:'16:00'},
 {d:'18',wd:'sex',full:'Sexta-feira',start:'08:45'},
 {d:'19',wd:'sáb',full:'Sábado',start:'06:00'},

 {d:'21',wd:'seg',full:'Segunda-feira',start:'09:00'},
 {d:'22',wd:'ter',full:'Terça-feira',start:'09:30'}];
const DL=DAYS.map(x=>x.d);

/* Cada evento: dur = minutos no local; travel = deslocamento antes; fixed = horário de início fixo; early = chegar X min antes;
   opens/closes = funcionamento; days = dias em que acontece; flex = estica para preencher espera; lock = fixo no lugar. */
const ITEMS={
 chegada:{day:'17',lock:1,title:'Chegada em Gramado e check-in no Airbnb',fixed:'16:00',dur:60,desc:'Acomodar malas e organizar o Rafael e as crianças.'},
 mercado:{day:'17',short:'mercado',title:'Supermercado',travel:[10,'Airbnb → supermercado'],dur:65,desc:'Mantimentos, papinhas, fraldas e itens para cozinhar no Airbnb durante a semana.'},
 jantar17:{day:'17',short:'jantar em casa',title:'Jantar caseiro e descanso',tag:['food','Jantar'],travel:[10,'Volta ao Airbnb'],dur:60,flex:1},
 despertar:{day:'17',short:'Despertar das Luzes',title:'O Despertar das Luzes',tag:['free','Gratuito'],travel:[15,'Airbnb → Palácio dos Festivais'],fixed:'20:00',dur:20,desc:'Show de acendimento em frente ao Palácio dos Festivais. Opcional, só se a turma ainda tiver energia.',links:[...NL,map('Palácio dos Festivais Gramado')]},
 volta17:{day:'17',lock:1,home:1,title:'Volta ao Airbnb',travel:[15,'Palácio → Airbnb'],dur:0},

 florybal:{day:'18',short:'Florybal',title:'Parque Terra Mágica Florybal',travel:[30,'Gramado → Florybal, Canela'],dur:180,opens:'09:00',closes:'16:30',desc:'Visita completa leva cerca de 2h30 a 3h. Há aluguel de carrinho de bebê no parque, útil para o Rafael.',links:[['Instagram','https://www.instagram.com/parqueterramagicaflorybal/'],map('Parque Terra Mágica Florybal Canela')]},
 churrasco:{day:'18',short:'churrascaria',title:'Almoço em churrascaria',tag:['food','Almoço'],travel:[15,'Florybal → centro de Canela'],dur:90,desc:'Garfo e Bombacha ou Espelho Gaúcho. Confirme o horário do almoço na reserva.',resv:'Reserve com antecedência: em dezembro as churrascarias de Canela lotam no almoço.',links:[['Instagram Garfo e Bombacha','https://www.instagram.com/garfoebombacha/'],map('Churrascaria Garfo e Bombacha Canela')]},
 skyglass:{day:'18',short:'SkyGlass',title:'SkyGlass Canela',travel:[20,'Canela → SkyGlass'],dur:135,opens:'09:00',closes:'18:00',desc:'Plataforma de vidro sobre o Vale da Ferradura, aberta das 9h às 18h. Para o Rafael, prefira o canguru.',links:[['Instagram','https://www.instagram.com/skyglasscanela/'],map('Skyglass Canela')]},
 descanso18:{day:'18',title:'Descanso no Airbnb',travel:[40,'SkyGlass → Airbnb'],dur:60,flex:1,desc:'Banho, troca de roupa e um lanche reforçado para Guilherme, Gustavo e Rafael, já que o jantar será mais tarde.'},
 catedral:{day:'18',title:'Chegada à Catedral de Pedra',travel:[30,'Gramado → Catedral de Pedra, com trânsito de dezembro'],fixed:'19:45',dur:45,desc:'Chegue cedo para ficar de frente para a fachada. Às 20h há o show de luzes e som das Casas Cantantes.',links:[...SN,map('Catedral de Pedra Canela')]},
 descida:{day:'18',short:'Papai Noel de rapel',title:'Descida do Papai Noel de rapel',tag:['free','Gratuito'],fixed:'20:30',dur:15,days:['18','19','20','21'],desc:'Espetáculo “Contos da Catedral: O Segredo do Velho Noel”, na Catedral de Pedra, com cerca de 15 min.',links:SN},
 kongo:{day:'18',short:'Kongo',title:'Jantar na Kongo Pizzaria',tag:['food','Jantar'],travel:[15,'Catedral → Kongo'],dur:90,opens:'18:00',closes:'23:30',desc:'Av. das Hortênsias, 5683. Show com personagens às 22h. Crianças até 4 anos não pagam.',resv:'Reserve com antecedência: sem reserva, o atendimento é por ordem de chegada e pode haver fila no Natal Luz.',links:[['Site oficial','https://www.kongogramado.com.br/'],map('Kongo Pizzaria Gramado')]},
 volta18:{day:'18',lock:1,home:1,title:'Volta ao Airbnb',travel:[15,'Kongo → Airbnb'],dur:0},

/* Estado salvo neste aparelho */
const KEY='roteiro-gramado-v2';
const defaults=()=>{const o={};DL.forEach(d=>o[d]=[]);for(const id in ITEMS)o[ITEMS[id].day].push(id);return {order:o,removed:[],fixed:{}}};
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}return normalize(s)}
function normalize(s){
  if(!s||!s.order)return defaults();s=JSON.parse(JSON.stringify(s));
  const seen=new Set();DL.forEach(d=>{s.order[d]=(s.order[d]||[]).filter(id=>ITEMS[id]&&!seen.has(id)&&seen.add(id))});
  s.removed=(s.removed||[]).filter(r=>ITEMS[r.id]&&!seen.has(r.id)&&seen.add(r.id));
  for(const id in ITEMS)if(!seen.has(id))s.order[ITEMS[id].day].push(id);
  s.fixed=s.fixed||{};return s}
let S=load();
/* Modo compartilhado: no Netlify o roteiro fica salvo online e só quem tem o código edita. */
const API='/api/roteiro';let REMOTE=false,rev=0,code='';
try{code=localStorage.getItem(KEY+'-code')||''}catch(e){}
const canEdit=()=>!REMOTE||!!code;
function save(){
  if(!REMOTE){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}
  const body=JSON.stringify({baseRev:rev,state:S});
  fetch(API,{method:'PUT',headers:{'content-type':'application/json','x-edit-code':code},body}).then(async r=>{
    const j=await r.json().catch(()=>null);
    if(r.ok&&j){rev=j.rev;return}
    if(r.status===409&&j){S=normalize(j.state);rev=j.rev;render();toast('Outra pessoa alterou o roteiro antes. Mostrando a versão mais recente; refaça a sua mudança.');return}
    if(r.status===401){code='';try{localStorage.removeItem(KEY+'-code')}catch(e){}await pull(true);toast('Código de edição inválido. A mudança não foi salva.');return}
    await pull(true);toast('Não foi possível salvar. Verifique a conexão e tente de novo.')
  }).catch(()=>{toast('Sem conexão: a mudança não foi salva.');setTimeout(()=>pull(true),1500)})}
async function pull(force){
  try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)return false;const j=await r.json();
    REMOTE=true;if(force||j.rev!==rev){rev=j.rev||0;S=normalize(j.state);if(!document.querySelector('.sheet')&&!sw)render()}return true}catch(e){return false}}
const snap=()=>JSON.parse(JSON.stringify(S));

const toM=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const hm=m=>{m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return String(h%24).padStart(2,'0')+':'+String(mm).padStart(2,'0')};
const dur=m=>m>=60?(Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')):m+' min';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fixedOf=id=>Object.prototype.hasOwnProperty.call(S.fixed,id)?S.fixed[id]:(ITEMS[id].fixed||null);
const dayObj=d=>DAYS.find(x=>x.d===d);

function compute(d){
  let cur=toM(dayObj(d).start),out=[],prev=null;
  for(const id of S.order[d]){
    const it=ITEMS[id],fx=fixedOf(id),tr=it.travel?it.travel[0]:0,alerts=[];
    let arrive=cur+tr,gap=0,target=null;
    if(fx)target=toM(fx)-(it.early||0);else if(it.opens)target=toM(it.opens);
    if(target!=null&&arrive<target){gap=target-arrive;if(prev&&prev.flex){prev.end+=gap;gap=0}arrive=target}
    let start=fx?Math.max(toM(fx),arrive):arrive;
    if(fx&&arrive>toM(fx)-(it.early||0)){
      if(arrive>toM(fx))alerts.push(`Começa às ${fx}, mas vocês só chegam às ${hm(arrive)}.`);
      else alerts.push(`O ideal é chegar até ${hm(toM(fx)-it.early)}; pela sequência, vocês chegam às ${hm(arrive)}.`)}
    const end=start+it.dur;
    if(it.days&&!it.days.includes(d))alerts.push(`Não acontece em ${d}/12. Datas nesta semana: ${it.days.map(x=>x+'/12').join(', ')}.`);
    if(it.closes&&end>toM(it.closes))alerts.push(`Fecha às ${it.closes}; pela sequência, a visita termina às ${hm(end)}.`);
    if(end>24*60)alerts.push('Termina depois da meia-noite.');
    const r={id,it,fx,tr,travelStart:arrive-tr,start,end,gap,alerts,flex:!!it.flex};
    out.push(r);prev=r;cur=end}
  return out}

function dayTitle(rows){const s=rows.map(r=>r.it.short).filter(Boolean);if(!s.length)return 'Dia livre';
  const t=s.length>1?s.slice(0,-1).join(', ')+' e '+s[s.length-1]:s[0];return t.charAt(0).toUpperCase()+t.slice(1)}

function render(){
  document.getElementById('tab-roteiro').setAttribute('aria-pressed',tab==='roteiro');
  document.getElementById('tab-excluidos').setAttribute('aria-pressed',tab==='excluidos');
  document.getElementById('tab-infos').setAttribute('aria-pressed',tab==='infos');
  const eb=document.getElementById('editbtn');eb.hidden=!REMOTE;
  eb.className='editbtn'+(code?' on':'');
  eb.innerHTML=code?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 6.8-1.2"/></svg>Editando':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 7 0V11"/></svg>Editar';
  const n=S.removed.length;document.getElementById('remcount').innerHTML=n?`<span class="badge">${n}</span>`:'';
  const days=document.getElementById('days');days.hidden=tab!=='roteiro';
  days.innerHTML=DAYS.map(x=>{const bad=compute(x.d).some(r=>r.alerts.length);
    return `<button data-day="${x.d}" aria-pressed="${x.d===cur}" aria-label="${x.full}, ${x.d} de dezembro"><b>${x.d}</b><small>${x.wd}</small>${bad?'<span class="dot" aria-hidden="true"></span>':''}</button>`}).join('');
  const v=document.getElementById('view');
  if(sortable){sortable.destroy();sortable=null}
  if(tab==='roteiro')v.innerHTML=renderDay(cur);
  else if(tab==='excluidos')v.innerHTML=renderRemoved();
  else v.innerHTML=renderInfos();
  if(tab==='roteiro'&&window.Sortable&&canEdit()){
    sortable=Sortable.create(document.getElementById('tl'),{handle:'.grip',animation:160,filter:'.locked',preventOnFilter:false,
      onMove:e=>!e.related.classList.contains('locked-end'),
      onEnd:e=>{if(e.oldIndex===e.newIndex)return;const before=snap();
        S.order[cur]=[...document.querySelectorAll('#tl > li')].map(li=>li.dataset.id);save();render();toast('Ordem atualizada',before)}})}
}

function renderDay(d){
  const rows=compute(d),x=dayObj(d);
  const body=rows.map((r,i)=>{
    const it=r.it,lock=it.lock||!canEdit();
    const gap=r.gap>=10?`<div class="gap">${IC.clock}Tempo livre · <b>${dur(r.gap)}</b></div>`:'';
    const travel=r.tr?`<div class="travel">${IC.car}<b>${hm(r.travelStart)}</b> · ${dur(r.tr)} · ${esc(it.travel[1])}</div>`:'';
    const tags=(it.tag?`<span class="chip ${it.tag[0]}">${esc(it.tag[1])}</span>`:'')+(r.fx&&!lock?`<span class="chip fix">${IC.pin} ${r.fx}</span>`:'');
    const sched=it.early?`<p class="sched">Chegar até ${hm(toM(r.fx||it.fixed)-it.early)}</p>`:'';
    const alerts=r.alerts.map(a=>`<p class="alert">${IC.warn}<span>${esc(a)}</span></p>`).join('');
    const links=it.links?`<div class="links">${it.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}</div>`:'';
    const ctrl=lock?'':`<button class="icbtn more" data-more="${r.id}" aria-label="Opções de ${esc(it.title)}">${IC.more}</button><span class="icbtn grip" aria-label="Arrastar para reordenar" title="Arrastar para reordenar">${IC.grip}</span>`;
    const time=it.dur?`<b>${hm(r.start)}</b><span>${hm(r.end)}</span>`:`<b>${hm(r.start)}</b>`;
    return `<li class="item${lock?' locked':''}${it.home||r.id==='saida'?' locked-end':''}" data-id="${r.id}">${gap}${travel}
      <div class="row"><div class="time">${time}</div>
      <div class="swipe">${lock?'':`<div class="actions"><button class="mv" data-move="${r.id}">${IC.move}Mover</button><button class="del" data-del="${r.id}">${IC.trash}Excluir</button></div>`}
      <div class="card" data-card="${lock?'':r.id}"><div class="top">${tags}<span class="sp"></span>${ctrl}</div>
      <h3>${esc(it.title)}</h3>${sched}${it.desc?`<p>${esc(it.desc)}</p>`:''}${alerts}${it.resv?`<p class="resv">${esc(it.resv)}</p>`:''}${links}</div></div></div></li>`}).join('');
  return `<div class="dayhead"><span class="wk">${x.full} · ${d}/12</span><h2>${esc(dayTitle(rows))}</h2><p>${canEdit()?'Deslize um evento para a esquerda para mover ou excluir. Segure os pontinhos para mudar a ordem.':'Somente leitura. Toque em Editar e informe o código para alterar o roteiro.'}</p></div>
    <ol class="tl" id="tl">${body||''}</ol>${rows.length?'':'<p class="empty">Nenhum evento neste dia.</p>'}`}

function renderRemoved(){
  const list=S.removed.map(r=>{const it=ITEMS[r.id];return `<div class="box rem"><div><h3>${esc(it.title)}</h3><small>Estava em ${r.day}/12</small></div>${canEdit()?`<button class="btn" data-restore="${r.id}">Reativar</button>`:''}</div>`}).join('');
  return `<section class="panel"><h2>Excluídos</h2><p class="lead">Eventos que você tirou do roteiro. Reative para escolher o dia e a posição.</p>${list||'<p class="empty">Nenhum evento excluído.</p>'}</section>`}

function openSheet(id,mode){
  const removed=S.removed.find(r=>r.id===id);
  let fromDay=removed?removed.day:DL.find(d=>S.order[d].includes(id));
  let day=fromDay;
  const fx=fixedOf(id),it=ITEMS[id];
  let pos=null;
  if(removed){pos=Math.max(0,removed.index)}else{pos=S.order[fromDay].indexOf(id)}
  const layer=document.getElementById('layer');
  const draw=()=>{
    const others=S.order[day].filter(x=>x!==id);
    const rows=compute(day).filter(r=>r.id!==id);
    const defPos=day===fromDay?Math.min(pos,others.length):others.length-(others.length&&ITEMS[others[others.length-1]].home?1:0);
    const opts=['<option value="0">No início do dia</option>'].concat(rows.map((r,i)=>`<option value="${i+1}">Depois de ${hm(r.start)} · ${esc(r.it.title)}</option>`)).join('');
    layer.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="in">
      <h2 id="sh-t">${mode==='restore'?'Reativar':'Mover'}: ${esc(it.title)}</h2>
      <div><div class="lbl">Dia</div><div class="seg">${DAYS.map(x=>`<button data-sday="${x.d}" aria-pressed="${x.d===day}"><b>${x.d}</b><small>${x.wd}</small></button>`).join('')}</div></div>
      <div><label class="lbl" for="sh-pos">Posição</label><select id="sh-pos">${opts}</select></div>
      <div><div class="lbl">Horário</div><div class="radio">
        <label><input type="radio" name="sh-mode" id="sh-seq" value="seq" ${fx?'':'checked'}> Seguir a sequência do dia</label>
        <label><input type="radio" name="sh-mode" id="sh-fix" value="fix" ${fx?'checked':''}> Começar às <input type="time" id="sh-time" value="${fx||'10:00'}" step="300"></label>
      </div>${it.fixed?`<p style="margin:6px 0 0;color:var(--muted);font-size:13px">Horário oficial: ${it.fixed}${it.days?' · datas: '+it.days.map(x=>x+'/12').join(', '):''}</p>`:''}</div>
      <div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="sh-ok">${mode==='restore'?'Reativar':'Mover'}</button></div></div></div>`;
    layer.querySelector('#sh-pos').value=String(defPos);
    layer.querySelector('#sh-time').addEventListener('input',()=>{layer.querySelector('#sh-fix').checked=true});
  };
  draw();
  layer.onclick=e=>{
    const t=e.target.closest('[data-sday],[data-close],#sh-ok');if(!t)return;
    if(t.dataset.sday){pos=Number(layer.querySelector('#sh-pos').value);day=t.dataset.sday;draw();return}
    if(t.hasAttribute('data-close')){layer.innerHTML='';return}
    const before=snap();
    const p=Number(layer.querySelector('#sh-pos').value);
    DL.forEach(d=>S.order[d]=S.order[d].filter(x=>x!==id));S.removed=S.removed.filter(r=>r.id!==id);
    S.order[day].splice(p,0,id);
    if(layer.querySelector('#sh-fix').checked){const v=layer.querySelector('#sh-time').value;if(v)S.fixed[id]=v}else S.fixed[id]=null;
    save();layer.innerHTML='';cur=day;tab='roteiro';remember();render();window.scrollTo(0,0);
    toast(mode==='restore'?`Reativado em ${day}/12`:`Movido para ${day}/12`,before)};
  setTimeout(()=>layer.querySelector('#sh-ok')&&layer.querySelector('#sh-ok').focus(),30);
}

function openCode(){
  const layer=document.getElementById('layer');
  layer.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cd-t"><div class="in">
   <h2 id="cd-t">Código de edição</h2><p style="margin:0;color:var(--muted)">Informe o código para mover, excluir e reativar eventos. Ele fica guardado neste aparelho.</p>
   <form id="cd-f"><input class="codein" id="cd-in" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Código de edição"></form>
   <p id="cd-err" style="margin:0;color:var(--red);font-weight:600" hidden>Código incorreto.</p>
   <div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="cd-ok">Entrar</button></div></div></div>`;
  const inp=layer.querySelector('#cd-in');setTimeout(()=>inp.focus(),30);
  const go=async()=>{const v=inp.value.trim();if(!v)return;
    try{const r=await fetch(API,{method:'POST',headers:{'x-edit-code':v}});
      if(r.ok){code=v;try{localStorage.setItem(KEY+'-code',v)}catch(e){}layer.innerHTML='';render();toast('Modo de edição ativado')}
      else{layer.querySelector('#cd-err').hidden=false;inp.select()}}catch(e){layer.querySelector('#cd-err').textContent='Sem conexão. Tente de novo.';layer.querySelector('#cd-err').hidden=false}};
  layer.querySelector('#cd-f').addEventListener('submit',e=>{e.preventDefault();go()});
  layer.onclick=e=>{if(e.target.closest('[data-close]'))layer.innerHTML='';else if(e.target.closest('#cd-ok'))go()}}

function del(id){const before=snap();const d=DL.find(x=>S.order[x].includes(id));const i=S.order[d].indexOf(id);
  S.order[d].splice(i,1);S.removed.unshift({id,day:d,index:i});save();render();toast('Evento excluído',before)}

let tt=null;
function toast(msg,before){const old=document.querySelector('.toast');if(old)old.remove();clearTimeout(tt);
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
  el.innerHTML=`<span>${esc(msg)}</span>${before?'<button>Desfazer</button>':''}`;document.body.appendChild(el);
  if(before)el.querySelector('button').onclick=()=>{S=before;save();render();el.remove()};
  tt=setTimeout(()=>el.remove(),5000)}
const remember=()=>{try{localStorage.setItem(KEY+'-day',cur)}catch(e){}};

/* Deslizar para revelar ações */
const OPEN=-152;let open=null,sw=null;
function closeOpen(){if(open){open.style.transform='';open=null}}
document.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card[data-card]');
  if(open&&!e.target.closest('.swipe')){closeOpen()}
  if(!card||!card.dataset.card||e.target.closest('.grip,button,a'))return;
  if(open&&open!==card)closeOpen();
  sw={card,x:e.clientX,y:e.clientY,base:card===open?OPEN:0,dx:0,active:false,id:e.pointerId}});
document.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.active){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){sw.active=true;sw.card.classList.add('dragging');try{sw.card.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(dy)>10){sw=null;return}else return}
  sw.dx=dx;const x=Math.min(0,Math.max(OPEN-40,sw.base+dx));sw.card.style.transform=`translateX(${x}px)`});
function endSwipe(e){if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;if(!s.active)return;s.card.classList.remove('dragging');
  const x=s.base+s.dx;if(x<OPEN/2){s.card.style.transform=`translateX(${OPEN}px)`;open=s.card}else{s.card.style.transform='';if(open===s.card)open=null}}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',endSwipe);

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-day],[data-more],[data-move],[data-del],[data-restore],#reset,#logout,#editbtn,#tab-roteiro,#tab-excluidos,#tab-infos');if(!t)return;
  if(t.id==='editbtn'){if(!code)openCode();else{tab='infos';render();window.scrollTo(0,0)}return}
  if(t.id==='logout'){code='';try{localStorage.removeItem(KEY+'-code')}catch(e){}render();toast('Modo de edição desativado neste aparelho');return}
  if(!canEdit()&&(t.dataset.more||t.dataset.move||t.dataset.del||t.dataset.restore||t.id==='reset'))return;
  if(t.dataset.day){cur=t.dataset.day;remember();closeOpen();render();window.scrollTo(0,0);return}
  if(t.dataset.more){const c=t.closest('.card');if(open===c)closeOpen();else{closeOpen();c.style.transform=`translateX(${OPEN}px)`;open=c}return}
  if(t.dataset.move){closeOpen();openSheet(t.dataset.move,'move');return}
  if(t.dataset.del){closeOpen();del(t.dataset.del);return}
  if(t.dataset.restore){openSheet(t.dataset.restore,'restore');return}
  if(t.id==='reset'){if(t.dataset.confirm){const before=snap();S=defaults();save();tab='roteiro';cur=DL[0];remember();render();window.scrollTo(0,0);toast('Roteiro original restaurado',before)}
    else{t.dataset.confirm='1';t.textContent='Toque de novo para confirmar'}return}
  if(t.id.startsWith('tab-')){tab=t.id.slice(4);closeOpen();render();window.scrollTo(0,0)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('layer').innerHTML='';closeOpen()}});

render();
window.addEventListener('load',()=>window.scrollTo(0,0));
pull(true).then(ok=>{if(ok){render();setInterval(()=>{if(document.visibilityState==='visible')pull(false)},20000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull(false)})}});
})();
</script>

</body>
